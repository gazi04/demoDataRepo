[project]
name = "demodatarepo"
version = "0.1.0"
description = "It's a data project femo for testing out the SchemaGuard."
readme = "README.md"
authors = [
    { name = "gazi04", email = "gazmendhalili2016@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dbt>=2.0.6",
    "dbt-postgres>=1.11.0",
]

[project.scripts]
demodatarepo = "demodatarepo:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
